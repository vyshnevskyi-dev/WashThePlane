workflows:
  release:
    name: WashThePlane
    max_build_duration: 60
    instance_type: mac_mini_m2
    environment:
      xcode: latest
      groups:
        - head
      vars:
        XCODE_SCHEME: "WashThePlane"
        BUNDLE_ID: "com.washtheplane.released"
        TEAM_ID: "NB39L75G7X"
        MATCH_GIT_URL: "https://github.com/vyshnevskyi-dev/nb39l75g7x-certs.git"
        MATCH_PASSWORD: "kWa3CNRy!*tZ4bY#OqNIgcSa"
    scripts:
      - name: Fastlane match certs
        script: |
          gem install fastlane --no-document
          fastlane match appstore --readonly true \
            --app_identifier "$BUNDLE_ID" \
            --team_id "$TEAM_ID" \
            --git_url "$MATCH_GIT_URL"
      - name: Build IPA
        script: |
          xcode-project build-ipa \
            --project "WashThePlane.xcodeproj" \
            --scheme "$XCODE_SCHEME"
    artifacts:
      - build/ios/ipa/*.ipa
