workflows:
  release:
    name: Release
    max_build_duration: 60
    instance_type: mac_mini_m2
    environment:
      xcode: latest
      vars:
        XCODE_SCHEME: "WashThePlane"
        BUNDLE_ID: "com.washtheplane.released"
      ios_signing:
        distribution_type: app_store
        bundle_identifier: "com.washtheplane.released"
    scripts:
      - name: Build IPA
        script: xcode-project build-ipa --scheme "$XCODE_SCHEME" --project "WashThePlane.xcodeproj"
    artifacts:
      - build/ios/ipa/*.ipa
