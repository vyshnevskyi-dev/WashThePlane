workflows:
  release:
    name: Release
    max_build_duration: 60
    instance_type: mac_mini_m2
    environment:
      xcode: latest
      vars:
        XCODE_SCHEME: "WashThePlane"
        BUNDLE_ID: "com.washtheplane.released"
        TEAM_ID: "NB39L75G7X"
        MATCH_GIT_URL: "https://github.com/vyshnevskyi-dev/nb39l75g7x-certs.git"
        MATCH_PASSWORD: "kWa3CNRy!*tZ4bY#OqNIgcSa"
      groups:
        - head
    scripts:
      - name: Fetch certs via fastlane match
        script: |
          gem install fastlane --no-document
          fastlane match appstore \
            --readonly true \
            --app_identifier "$BUNDLE_ID" \
            --team_id "$TEAM_ID" \
            --git_url "$MATCH_GIT_URL"
      - name: Archive
        script: |
          xcodebuild archive \
            -project "WashThePlane.xcodeproj" \
            -scheme "$XCODE_SCHEME" \
            -archivePath "build/WashThePlane.xcarchive" \
            -destination "generic/platform=iOS" \
            -allowProvisioningUpdates \
            DEVELOPMENT_TEAM="$TEAM_ID"
      - name: Export IPA
        script: |
          xcodebuild -exportArchive \
            -archivePath "build/WashThePlane.xcarchive" \
            -exportPath "build/export" \
            -exportOptionsPlist /dev/stdin <<< '
            <?xml version="1.0" encoding="UTF-8"?>
            <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
            <plist version="1.0"><dict>
            <key>method</key><string>app-store</string>
            <key>teamID</key><string>'"$TEAM_ID"'</string>
            <key>signingStyle</key><string>manual</string>
            </dict></plist>'
    artifacts:
      - build/export/*.ipa
