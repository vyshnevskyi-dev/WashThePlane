workflows:
  release:
    name: Release
    max_build_duration: 60
    instance_type: mac_mini_m2
    environment:
      xcode: latest
      vars:
        XCODE_SCHEME: "WashThePlane"
        BUNDLE_ID: "com.washtheplane.released"
        TEAM_ID: "NB39L75G7X"
        MATCH_GIT_URL: "https://github.com/vyshnevskyi-dev/nb39l75g7x-certs.git"
        MATCH_PASSWORD: "kWa3CNRy!*tZ4bY#OqNIgcSa"
      groups:
        - head
    scripts:
      - name: Fetch certs via fastlane match
        script: |
          gem install fastlane --no-document
          fastlane match appstore \
            --readonly true \
            --app_identifier "$BUNDLE_ID" \
            --team_id "$TEAM_ID" \
            --git_url "$MATCH_GIT_URL"
      - name: Build IPA
        script: |
          xcode-project build-ipa \
            --project "WashThePlane.xcodeproj" \
            --scheme "$XCODE_SCHEME" \
            --archive-flags="CODE_SIGN_STYLE=Manual DEVELOPMENT_TEAM=$TEAM_ID PROVISIONING_PROFILE_SPECIFIER=match PROVISIONING_PROFILE=$HOME/Library/MobileDevice/Provisioning\\ Profiles/*.mobileprovision CODE_SIGN_IDENTITY=Apple\\ Distribution"
    artifacts:
      - build/ios/ipa/*.ipa
