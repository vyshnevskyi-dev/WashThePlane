workflows:
  release:
    name: Release
    max_build_duration: 60
    instance_type: mac_mini_m2
    environment:
      xcode: latest
      groups:
        - head
      vars:
        XCODE_SCHEME: "WashThePlane"
        BUNDLE_ID: "com.washtheplane.released"
        APP_STORE_CONNECT_KEY_IDENTIFIER: CGAC4L3D2T
        APP_STORE_CONNECT_ISSUER_ID: a2595058-57ae-4d5f-8bc7-3e1276717d1d
    scripts:
      - name: Create API key JSON
        script: |
          python3 -c "
          import json, os
          data = {
              'key_id': os.environ['APP_STORE_CONNECT_KEY_IDENTIFIER'],
              'issuer_id': os.environ['APP_STORE_CONNECT_ISSUER_ID'],
              'key': os.environ['APP_STORE_CONNECT_PRIVATE_KEY'],
              'in_house': False
          }
          with open('/tmp/api_key.json', 'w') as f:
              json.dump(data, f, indent=2)
          "
      - name: Fetch signing files
        script: |
          app-store-connect fetch-signing-files "$BUNDLE_ID" \
            --type IOS_APP_STORE \
            --create \
            --api_key_path /tmp/api_key.json
      - name: Build IPA
        script: |
          xcode-project build-ipa \
            --project "WashThePlane.xcodeproj" \
            --scheme "$XCODE_SCHEME"
    artifacts:
      - build/ios/ipa/*.ipa
