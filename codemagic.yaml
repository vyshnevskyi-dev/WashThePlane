workflows:
  release:
    name: Release
    max_build_duration: 60
    instance_type: mac_mini_m2
    environment:
      xcode: latest
      vars:
        XCODE_SCHEME: "WashThePlane"
        BUNDLE_ID: "com.washtheplane.released"
        TEAM_ID: "NB39L75G7X"
        MATCH_GIT_URL: "https://github.com/vyshnevskyi-dev/nb39l75g7x-certs.git"
        MATCH_PASSWORD: "kWa3CNRy!*tZ4bY#OqNIgcSa"
        APP_STORE_CONNECT_KEY_IDENTIFIER: CGAC4L3D2T
        APP_STORE_CONNECT_ISSUER_ID: a2595058-57ae-4d5f-8bc7-3e1276717d1d
      groups:
        - head
    scripts:
      - name: Fetch certs via fastlane match
        script: |
          gem install fastlane --no-document
          fastlane match appstore \
            --readonly true \
            --app_identifier "$BUNDLE_ID" \
            --team_id "$TEAM_ID" \
            --git_url "$MATCH_GIT_URL"
      - name: Build IPA
        script: |
          xcode-project build-ipa \
            --project "WashThePlane.xcodeproj" \
            --scheme "$XCODE_SCHEME" \
            --archive-flags="-destination 'generic/platform=iOS'"
    artifacts:
      - build/ios/ipa/*.ipa
