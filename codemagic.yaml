workflows:
  build-and-publish:
    name: WashThePlane
    max_build_duration: 60
    instance_type: mac_mini_m2
    environment:
      xcode: latest
      cocoapods: default
      groups:
        - head
      vars:
        BUNDLE_ID: com.washtheplane.released
    scripts:
      - name: Build IPA
        script: xcode-project build-ipa --project "WashThePlane.xcodeproj" --scheme "WashThePlane"
    artifacts:
      - build/ios/ipa/*.ipa
