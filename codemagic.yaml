workflows:
  build-and-publish:
    name: WashThePlane — Build Test
    max_build_duration: 60
    instance_type: mac_mini_m2
    environment:
      xcode: latest
      cocoapods: default
      vars:
        BUNDLE_ID: com.washtheplane.released
    scripts:
      - name: Resolve packages
        script: |
          xcodebuild -resolvePackageDependencies \
            -project "WashThePlane.xcodeproj" \
            -scheme "WashThePlane"
      - name: Build (no signing)
        script: |
          xcodebuild build \
            -project "WashThePlane.xcodeproj" \
            -scheme "WashThePlane" \
            -destination "generic/platform=iOS" \
            CODE_SIGNING_ALLOWED=NO
    artifacts:
      - build/ios/ipa/*.ipa
